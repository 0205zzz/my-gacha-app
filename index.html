<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="娃娃機">
<meta name="theme-color" content="#0a0a0a">
<title>娃娃機記帳 - 萬筆大容量分流版 </title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/iconfont/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--bg4:#2e2e2e;
  --border:#333;--border2:#444;
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
  --green:#00c97f;--green-dim:#0a2e1f;--green-text:#00e896;
  --red:#ff5a47;--red-dim:#2e0f0a;--red-text:#ff7a6a;
  --gold:#f0b429;--gold-dim:#2a1f00;
  --blue:#4d9fff;--blue-dim:#0a1e33;
  --radius:10px;--radius-sm:7px;
  --nav-h:58px;
}
body.light{
  --bg:#f4f3ee;--bg2:#ffffff;--bg3:#ebebе6;--bg4:#deded9;
  --border:#d4d3ce;--border2:#b0afa9;
  --text:#111;--text2:#555;--text3:#999;
  --green:#00915c;--green-dim:#d0f0e2;--green-text:#006e44;
  --red:#d63020;--red-dim:#fde5e2;--red-text:#b01a0c;
  --gold:#b07800;--gold-dim:#fff0cc;
  --blue:#1e65cc;--blue-dim:#ddeeff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans TC',sans-serif;font-size:15px;overflow:hidden}
input,select,button,textarea{font-family:inherit;font-size:14px;-webkit-appearance:none;appearance:none;outline:none}
input,select{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;background:var(--bg3);color:var(--text);width:100%}
input:focus,select:focus{border-color:var(--border2)}
select option{background:var(--bg3)}
button{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 16px;background:var(--bg3);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:active{opacity:.65}
button.prim{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}

.root{height:100%;display:flex;flex-direction:column}
.nav{height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--text3);background:none;border:none;padding:6px 4px;cursor:pointer;border-top:2px solid transparent;margin-top:-1px}
.nb.on{color:var(--green);border-top-color:var(--green)}
.nb i{font-size:20px}

.pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:0 16px 20px;display:none;flex-direction:column}
.page.on{display:flex}
.sub{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:0 16px 20px;display:none;flex-direction:column;z-index:50}
.sub.on{display:flex}

.topbar{display:flex;align-items:center;gap:8px;padding:14px 0 11px;position:sticky;top:0;background:var(--bg);z-index:10;flex-shrink:0}
.topbar h2{flex:1;font-size:17px;font-weight:600;letter-spacing:-.3px}
.back{background:var(--blue);border:none;border-radius:var(--radius-sm);color:#fff;font-size:13px;font-weight:600;padding:6px 12px;gap:4px;}
.back i{font-size:15px}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.tap{cursor:pointer}
.tap:active{opacity:.75}

.sg{display:grid;gap:8px;margin-bottom:12px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:1fr 1fr 1fr}
.st{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.st .lb{font-size:11px;color:var(--text3);margin-bottom:3px}
.st .vl span{font-size:16px;font-weight:600}
.pos{color:var(--green-text)}.neg{color:var(--red-text)}

.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:99px;font-weight:500}
.tc{background:var(--gold-dim);color:var(--gold)}
.ta{background:var(--blue-dim);color:var(--blue)}
.toff{background:var(--bg4);color:var(--text3)}

.fg{margin-bottom:10px}
.fg label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}

.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text3);font-weight:500;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
td.r{text-align:right}
tr:last-child td{border-bottom:none}

.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{padding:8px 14px;font-size:13px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;border-radius:0;white-space:nowrap}
.tab.on{color:var(--green);border-bottom-color:var(--green)}

.sbg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:none;align-items:flex-end}
.sbg.on{display:flex}
.sh{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.shd{display:flex;align-items:center;margin-bottom:16px}
.shd span{flex:1;font-size:16px;font-weight:600}

.mg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;margin-top:8px}

.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pc {background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);position:relative;overflow:hidden;padding:12px}

.empty{text-align:center;color:var(--text3);padding:2.5rem 0}
.empty i{font-size:38px;display:block;margin-bottom:8px}

.sslbl">.sslbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;padding:0 2px}
.ssec{margin-bottom:18px}
.thopts{display:flex;gap:8px;margin-top:6px}
.thopt{flex:1;border:2px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;cursor:pointer;font-size:12px;font-weight:500}
.thopt.on{border-color:var(--green);color:var(--green)}
.thsw{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;border:2px solid var(--border)}

.g-user-box{display:flex;align-items:center;gap:12px;margin-top:10px}
.g-avatar{width:36px;height:36px;border-radius:50%;background:var(--bg4)}
.g-info{flex:1;font-size:13px;line-height:1.4}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px}
.setting-row:last-child{border-bottom:none}
.sr-label{font-size:14px;font-weight:500}
</style>
</head>
<body>
<div class="root">
  <div class="pages" id="pages">

    <div id="p-machines" class="page on">
      <div class="topbar"><h2><i class="ti ti-crane"></i> 娃娃機</h2>
        <button id="btn-add-m" onclick="openAddMachine()" disabled><i class="ti ti-plus"></i> 新增機台</button>
      </div>
      <div id="home-stats" class="sg c3"></div>
      <div id="machine-list"><div class="empty"><i class="ti ti-lock"></i>請先到「設定」登入 Google 帳號</div></div>
      <div id="empty-home" class="empty" style="display:none"><i class="ti ti-crane"></i>還沒有機台</div>
    </div>

    <div id="p-monthly" class="page">
      <div class="topbar"><h2><i class="ti ti-calendar-stats"></i> 月報表</h2></div>
      <div id="monthly-content"></div>
    </div>

    <div id="p-prizes" class="page">
      <div class="topbar"><h2><i class="ti ti-gift"></i> 獎品庫存</h2>
        <button onclick="showAddPrize()"><i class="ti ti-plus"></i> 新增獎品</button>
      </div>
      <div id="prize-stats" class="sg c2"></div>
      
      <div id="prize-add-form" class="fcard" style="display:none">
        <div id="pz-form-title" style="font-size:14px;font-weight:600;margin-bottom:12px">新增獎品</div>
        <div class="fg"><label for="pz-name">獎品名稱</label><input type="text" id="pz-name"></div>
        <div class="fg2">
          <div class="fg"><label for="pz-cost">成本</label><input type="number" id="pz-cost"></div>
          <div class="fg"><label for="pz-qty">數量</label><input type="number" id="pz-qty" value="1"></div>
        </div>
        <div class="fg"><label for="pz-note">備註說明</label><input type="text" id="pz-note"></div>
        <div style="display:flex;gap:8px">
          <button class="prim" onclick="savePrize()">儲存</button>
          <button onclick="cancelPrizeForm()">取消</button>
        </div>
      </div>
      <div class="pg" id="prize-grid"></div>
    </div>

    <div id="p-other" class="page">
      <div class="topbar"><h2><i class="ti ti-receipt"></i> 其他成本</h2>
        <button onclick="openAddCat()"><i class="ti ti-plus"></i> 新增類別</button>
      </div>
      <div id="other-list"></div>
    </div>

    <div id="p-settings" class="page">
      <div class="topbar"><h2><i class="ti ti-settings"></i> 設定</h2></div>
      <div class="ssec">
        <div class="sslbl">Google 帳號聯動</div>
        <div class="card">
          <div style="font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px">
            <span id="sync-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5a47"></span>
            <span id="sync-status">未登入</span>
          </div>
          <div id="g-login-area" style="margin-top:12px">
            <button id="btn-g-auth" class="prim" onclick="handleGoogleLogin()" style="width:100%;justify-content:center;background:var(--blue);border-color:var(--blue)"><i class="ti ti-brand-google"></i> 使用 Google 帳號登入</button>
          </div>
          <div id="g-user-area" style="display:none">
            <div class="g-user-box">
              <img id="user-img" class="g-avatar" src="" alt="頭像">
              <div class="g-info">
                <div id="user-name" style="font-weight:600">載入中...</div>
                <div id="user-email" style="font-size:11px;color:var(--text2)">載入中...</div>
              </div>
              <button onclick="handleGoogleLogout()" style="font-size:11px;padding:4px 8px;border-color:var(--red);color:var(--red-text)">登出</button>
            </div>
          </div>
        </div>
      </div>
      
      <div class="ssec">
        <div class="sslbl">外觀</div>
        <div class="card">
          <div class="thopts">
            <div class="thopt on" id="th-dark" onclick="setTheme('dark')"><div class="thsw" style="background:#0f0f0f"></div>深色</div>
            <div class="thopt" id="th-light" onclick="setTheme('light')"><div class="thsw" style="background:#f4f3ee"></div>淺色</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div id="sub-machine" class="sub">
    <div class="topbar">
      <button class="back" onclick="closeSub('sub-machine');renderHome()"><i class="ti ti-arrow-left"></i> 返回</button>
      <h2 id="md-title" style="margin-left:8px;flex:1">機台詳情</h2>
      <button onclick="delMachine()" style="color:var(--red-text);border:none;background:none"><i class="ti ti-trash"></i> 刪除機台</button>
    </div>
    <div id="md-stats" class="sg c2"></div>
    <div class="tabs">
      <button class="tab on" id="t-rec" onclick="setMDTab('rec')">抄表紀錄</button>
      <button class="tab" id="t-rent" onclick="setMDTab('rent')">租金設定</button>
    </div>
    
    <div id="tab-rec-content">
      <button class="prim" onclick="openAddRec()" style="width:100%;justify-content:center;margin-bottom:12px"><i class="ti ti-plus"></i> 新增抄表紀錄</button>
      <div class="tw"><table><thead><tr id="th-rec-head"></tr></thead><tbody id="rec-tb"></tbody></table></div>
    </div>
    
    <div id="tab-rent-content" style="display:none">
      <div class="fcard">
        <div class="fg2">
          <div class="fg"><label for="rs">起始日期</label><input type="date" id="rs"></div>
          <div class="fg"><label for="re">結束日期</label><input type="date" id="re"></div>
        </div>
        <div class="fg2">
          <div class="fg"><label for="ra">總金額</label><input type="number" id="ra"></div>
          <div class="fg"><label for="rn">租金備註</label><input type="text" id="rn"></div>
        </div>
        <button class="prim" onclick="mdAddRent()" style="width:100%;justify-content:center;margin-top:8px">確認新增租金</button>
      </div>
      <div class="tw"><table><thead><tr><th>起始日期</th><th>結束日期</th><th>金額</th><th>備註</th></tr></thead><tbody id="rent-tb"></tbody></table></div>
    </div>
  </div>

  <div id="sub-other" class="sub">
    <div class="topbar">
      <button class="back" onclick="closeSub('sub-other');renderOther()"><i class="ti ti-arrow-left"></i> 返回</button>
      <h2 id="oth-title" style="margin-left:8px;flex:1">類別明細</h2>
    </div>
    <div class="fcard">
      <div class="fg2">
        <div class="fg"><label for="od">日期</label><input type="date" id="od"></div>
        <div class="fg"><label for="oa">金額</label><input type="number" id="oa"></div>
      </div>
      <div class="fg"><label for="on">項目說明</label><input type="text" id="on"></div>
      <button class="prim" onclick="addOthItem()" style="width:100%;justify-content:center;margin-top:6px">確認新增明細</button>
    </div>
    <div class="tw"><table><thead><tr><th>日期</th><th>金額</th><th>項目說明</th><th>操作</th></tr></thead><tbody id="oth-tb"></tbody></table></div>
  </div>

  <div class="nav">
    <button class="nb on" id="b-machines" onclick="navTo('p-machines')"><i class="ti ti-crane"></i>首頁</button>
    <button class="nb" id="b-monthly" onclick="navTo('p-monthly')"><i class="ti ti-calendar-stats"></i>月報</button>
    <button class="nb" id="b-prizes" onclick="navTo('p-prizes')"><i class="ti ti-gift"></i>庫存</button>
    <button class="nb" id="b-other" onclick="navTo('p-other')"><i class="ti ti-receipt"></i>其他</button>
    <button class="nb" id="b-settings" onclick="navTo('p-settings')"><i class="ti ti-settings"></i>設定</button>
  </div>
</div>

<div class="sbg" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sh" id="sheet-content"></div></div>

<script>
window.userUID = null;
window.DB = { machines: [], prizes: [], categories: [] };
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAykiuo908yAQFa-qSoHhNw2LwmPZiiWFk",
    authDomain: "my-gacha-app-7514f.firebaseapp.com",
    projectId: "my-gacha-app-7514f",
    storageBucket: "my-gacha-app-7514f.firebasestorage.app",
    messagingSenderId: "630194612465",
    appId: "1:630194612465:web:ee860259a9ebbb30286150"
  };

try {
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      window.userUID = user.uid;
      document.getElementById('sync-dot').style.background = "#00c97f";
      document.getElementById('sync-status').innerText = "雲端即時同步中";
      document.getElementById('g-login-area').style.display = "none";
      document.getElementById('g-user-area').style.display = "block";
      document.getElementById('user-name').innerText = user.displayName || "用戶";
      document.getElementById('user-email').innerText = user.email;
      document.getElementById('user-img').src = user.photoURL || "";
      document.getElementById('btn-add-m').disabled = false;
      await loadCloudData(db);
    } else {
      window.userUID = null;
      document.getElementById('sync-dot').style.background = "#ff5a47";
      document.getElementById('sync-status').innerText = "請登入帳號";
      document.getElementById('g-login-area').style.display = "block";
      document.getElementById('g-user-area').style.display = "none";
      document.getElementById('btn-add-m').disabled = true;
    }
  });

  window.handleGoogleLogin = () => signInWithPopup(auth, provider).catch(e => alert("登入失敗: " + e.message));
  window.handleGoogleLogout = () => { if(confirm("確定登出？")) signOut(auth); };

  window.cloudSaveItem = async (col, id, data) => {
    if (!window.userUID) return;
    await setDoc(doc(db, "users", window.userUID, col, String(id)), data);
  };
  window.cloudDeleteItem = async (col, id) => {
    if (!window.userUID) return;
    await deleteDoc(doc(db, "users", window.userUID, col, String(id)));
  };
} catch(e) { console.error("Firebase 初始化失敗", e); }

async function loadCloudData(db) {
  try {
    const mSnap = await getDocs(collection(db, "users", window.userUID, "machines"));
    window.DB.machines = []; mSnap.forEach(d => window.DB.machines.push(d.data()));
    window.DB.machines.sort((a,b)=>b.id-a.id);

    const pSnap = await getDocs(collection(db, "users", window.userUID, "prizes"));
    window.DB.prizes = []; pSnap.forEach(d => window.DB.prizes.push(d.data()));

    const cSnap = await getDocs(collection(db, "users", window.userUID, "categories"));
    window.DB.categories = []; cSnap.forEach(d => window.DB.categories.push(d.data()));

    window.renderHome();
  } catch(e) { console.error(e); }
}
</script>

<script>
var curMId = null, curCId = null;

function navTo(p) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(x => x.classList.remove('on'));
  document.getElementById(p).classList.add('on');
  document.getElementById('b-' + p.replace('p-', '')).classList.add('on');
  if(p==='p-machines') renderHome();
  if(p==='p-prizes') renderPrizes();
  if(p==='p-other') renderOther();
  if(p==='p-monthly') renderMonthly();
}

function openSheet(h) { document.getElementById('sheet-content').innerHTML = h; document.getElementById('sheet').classList.add('on'); }
function closeSheet() { document.getElementById('sheet').classList.remove('on'); }
function closeSub(id) { document.getElementById(id).classList.remove('on'); }
function setTheme(t) { document.body.className = t; document.querySelectorAll('.thopt').forEach(x=>x.classList.remove('on')); document.getElementById('th-'+t).classList.add('on'); }

function gm() { return window.DB.machines.find(m => m.id === curMId); }
function gc() { return window.DB.categories.find(c => c.id === curCId); }

function calcS(m) {
  var inc = 0, cost = 0, rent = 0;
  if(m.records) m.records.forEach(r => { inc += parseInt(r.income)||0; cost += parseInt(r.cost)||0; });
  if(m.rents) m.rents.forEach(rt => { rent += parseInt(rt.amount)||0; });
  return { inc: inc, cost: cost, rent: rent, p: inc - cost - rent };
}

// 1. 首頁渲染與新增
function renderHome() {
  var sts = document.getElementById('home-stats'), list = document.getElementById('machine-list'), emp = document.getElementById('empty-home');
  if(!window.DB.machines || window.DB.machines.length === 0) { list.innerHTML=''; sts.innerHTML=''; emp.style.display='block'; return; }
  emp.style.display='none';
  var tI=0, tC=0, tR=0;
  window.DB.machines.forEach(m => { var s = calcS(m); tI+=s.inc; tC+=s.cost; tR+=s.rent; });
  sts.innerHTML = '<div class="st"><div class="lb">總收入</div><div class="vl"><span class="pos">$' + tI.toLocaleString() + '</span></div></div>' +
                  '<div class="st"><div class="lb">總成本</div><div class="vl"><span class="neg">$' + tC.toLocaleString() + '</span></div></div>' +
                  '<div class="st"><div class="lb">實賺利潤</div><div class="vl"><span>$' + (tI-tC-tR).toLocaleString() + '</span></div></div>';
  list.innerHTML = window.DB.machines.map(m => {
    var s = calcS(m);
    return '<div class="card tap" onclick="openMD(' + m.id + ')"><div style="font-weight:600">' + m.name + '</div>' +
           '<div class="mg"><div>收入: $' + s.inc + '</div><div>成本: $' + s.cost + '</div><div>利潤: $' + s.p + '</div></div></div>';
  }).join('');
}

function openAddMachine() {
  openSheet('<div class="shd"><span>新增娃娃機台</span></div>' +
            '<div class="fg"><label for="new-m-name">機台名稱/編號</label><input type="text" id="new-m-name" placeholder="例如: A1 補位機"></div>' +
            '<button class="prim" style="width:100%; justify-content:center; margin-top:10px" onclick="doAddMachine()">確認建立</button>');
}
async function doAddMachine() {
  var n = document.getElementById('new-m-name').value.trim(); if(!n) return;
  var nm = { id: Date.now(), name: n, records: [], rents: [] };
  window.DB.machines.unshift(nm);
  if(window.cloudSaveItem) await window.cloudSaveItem("machines", nm.id, nm);
  renderHome(); closeSheet();
}

async function delMachine() {
  if(!confirm("確定要刪除此機台與所有紀錄嗎？此動作不可逆！")) return;
  window.DB.machines = window.DB.machines.filter(m => m.id !== curMId);
  if(window.cloudDeleteItem) await window.cloudDeleteItem("machines", curMId);
  closeSub('sub-machine'); renderHome();
}

// 2. 抄表紀錄與租金管理
function openMD(id) { curMId = id; document.getElementById('sub-machine').classList.add('on'); setMDTab('rec'); }
function setMDTab(t) {
  document.getElementById('t-rec').className = t=='rec'?'tab on':'tab';
  document.getElementById('t-rent').className = t=='rent'?'tab on':'tab';
  document.getElementById('tab-rec-content').style.display = t=='rec'?'block':'none';
  document.getElementById('tab-rent-content').style.display = t=='rent'?'block':'none';
  if(t=='rec') renderMDRec(); else renderMDRent();
}
function renderMDRec() {
  var m = gm(), tbody = document.getElementById('rec-tb'), h = document.getElementById('th-rec-head');
  document.getElementById('md-title').innerText = m.name;
  h.innerHTML = '<th>日期</th><th>本次實收</th><th>花費成本</th><th>備註</th>';
  if(!m.records || m.records.length === 0) { tbody.innerHTML='<tr><td colspan="4" style="text-align:center;color:#666">尚無抄表紀錄</td></tr>'; return; }
  tbody.innerHTML = m.records.map(r => '<tr><td>'+r.date+'</td><td class="pos">$'+r.income+'</td><td class="neg">$'+r.cost+'</td><td>'+(r.note||'-')+'</td></tr>').join('');
}
function openAddRec() {
  openSheet('<div class="shd"><span>新增抄表數據</span></div>' +
            '<div class="fg"><label for="rd">抄表日期</label><input type="date" id="rd" value="'+new Date().toISOString().slice(0,10)+'"></div>' +
            '<div class="fg"><label for="ri">實收營業額 ($)</label><input type="number" id="ri" placeholder="0"></div>' +
            '<div class="fg"><label for="rc">補貨/出貨成本 ($)</label><input type="number" id="rc" value="0"></div>' +
            '<div class="fg"><label for="rn-rec">備註</label><input type="text" id="rn-rec" placeholder="無"></div>' +
            '<button class="prim" style="width:100%; justify-content:center; margin-top:10px" onclick="doAddRec()">確認送出</button>');
}
async function doAddRec() {
  var m = gm(), d = document.getElementById('rd').value, i = parseInt(document.getElementById('ri').value)||0, c = parseInt(document.getElementById('rc').value)||0, n = document.getElementById('rn-rec').value.trim();
  if(!d) return;
  m.records.unshift({ date: d, income: i, cost: c, note: n });
  if(window.cloudSaveItem) await window.cloudSaveItem("machines", m.id, m);
  renderMDRec(); closeSheet();
}
function renderMDRent() {
  var m = gm(), tbody = document.getElementById('rent-tb');
  if(!m.rents || m.rents.length === 0) { tbody.innerHTML='<tr><td colspan="4" style="text-align:center;color:#666">尚未設定租金</td></tr>'; return; }
  tbody.innerHTML = m.rents.map(r => '<tr><td>'+r.start+'</td><td>'+r.end+'</td><td class="neg">$'+r.amount+'</td><td>'+(r.note||'-')+'</td></tr>').join('');
}
async function mdAddRent() {
  var m = gm(), s = document.getElementById('rs').value, e = document.getElementById('re').value, a = parseInt(document.getElementById('ra').value)||0, n = document.getElementById('rn').value.trim();
  if(!s || !e || !a) { alert("請填寫完整租金資訊！"); return; }
  m.rents.unshift({ start: s, end: e, amount: a, note: n });
  if(window.cloudSaveItem) await window.cloudSaveItem("machines", m.id, m);
  renderMDRent(); document.getElementById('rs').value=''; document.getElementById('re').value=''; document.getElementById('ra').value=''; document.getElementById('rn').value='';
}

// 3. 月報表綜合統計
function renderMonthly() {
  var div = document.getElementById('monthly-content');
  var html = '<div class="card"><div style="font-weight:600;margin-bottom:10px">歷史總帳目表</div><table><thead><tr><th>項目名稱</th><th>總收入</th><th>總成本</th><th>總租金</th><th>淨利</th></tr></thead><tbody>';
  window.DB.machines.forEach(m => {
    var s = calcS(m);
    html += '<tr><td>'+m.name+'</td><td class="pos">$'+s.inc+'</td><td class="neg">$'+s.cost+'</td><td class="neg">$'+s.rent+'</td><td>$'+s.p+'</td></tr>';
  });
  html += '</tbody></table></div>';
  div.innerHTML = html;
}

// 4. 獎品庫存管理
function renderPrizes() {
  var grid = document.getElementById('prize-grid'), stats = document.getElementById('prize-stats');
  if(!window.DB.prizes || window.DB.prizes.length === 0) { grid.innerHTML='<div class="empty" style="grid-column:1/-1"><i class="ti ti-gift"></i>目前沒有庫存獎品</div>'; stats.innerHTML=''; return; }
  var tc = 0, tq = 0;
  window.DB.prizes.forEach(p => { tc += (parseInt(p.cost)||0)*(parseInt(p.qty)||0); tq += parseInt(p.qty)||0; });
  stats.innerHTML = '<div class="st"><div class="lb">庫存總件數</div><div class="vl"><span>'+tq+' 件</span></div></div><div class="st"><div class="lb">壓庫總成本</div><div class="vl"><span class="neg">$'+tc.toLocaleString()+'</span></div></div>';
  grid.innerHTML = window.DB.prizes.map((p, idx) => '<div class="pc"><div style="font-weight:600;font-size:14px">'+p.name+'</div><div style="color:var(--text2);font-size:12px;margin:5px 0">成本: $'+p.cost+' | 數量: '+p.qty+'</div><div style="font-size:11px;color:var(--text3)">'+(p.note||'無備註')+'</div><button onclick="delPrize('+idx+')" style="position:absolute;right:8px;top:8px;padding:2px 6px;border-color:var(--red);color:var(--red-text);font-size:11px">刪除</button></div>').join('');
}
function showAddPrize() { document.getElementById('prize-add-form').style.display='block'; }
function cancelPrizeForm() { document.getElementById('prize-add-form').style.display='none'; }
async function savePrize() {
  var n = document.getElementById('pz-name').value.trim(), c = parseInt(document.getElementById('pz-cost').value)||0, q = parseInt(document.getElementById('pz-qty').value)||1, nt = document.getElementById('pz-note').value.trim();
  if(!n) return;
  var np = { id: Date.now(), name: n, cost: c, qty: q, note: nt };
  window.DB.prizes.unshift(np);
  if(window.cloudSaveItem) await window.cloudSaveItem("prizes", np.id, np);
  renderPrizes(); cancelPrizeForm();
  document.getElementById('pz-name').value=''; document.getElementById('pz-cost').value=''; document.getElementById('pz-qty').value='1'; document.getElementById('pz-note').value='';
}
async function delPrize(idx) {
  if(!confirm("確定移除此庫存？")) return;
  var target = window.DB.prizes[idx];
  window.DB.prizes.splice(idx, 1);
  if(window.cloudDeleteItem) await window.cloudDeleteItem("prizes", target.id);
  renderPrizes();
}

// 5. 其他雜項成本與收入
function renderOther() {
  var div = document.getElementById('other-list');
  if(!window.DB.categories || window.DB.categories.length === 0) { div.innerHTML='<div class="empty"><i class="ti ti-receipt"></i>沒有建立其他項目類別</div>'; return; }
  div.innerHTML = window.DB.categories.map(c => {
    var total = 0; if(c.items) c.items.forEach(i=>total+=parseInt(i.amount)||0);
    return '<div class="card tap" onclick="openCat('+c.id+')"><div style="font-weight:600;display:flex;justify-content:between"><span>'+c.name+'</span><span class="neg" style="margin-left:auto">總計: $'+total+'</span></div></div>';
  }).join('');
}
function openAddCat() {
  var name = prompt("請輸入新類別名稱 (例如: 雜資、油錢、公關餐費):"); if(!name) return;
  var nc = { id: Date.now(), name: name, items: [] };
  window.DB.categories.unshift(nc);
  if(window.cloudSaveItem) window.cloudSaveItem("categories", nc.id, nc);
  renderOther();
}
function openCat(id) { curCId = id; var c = gc(); document.getElementById('oth-title').innerText = c.name; document.getElementById('sub-other').classList.add('on'); renderCatItems(); }
function renderCatItems() {
  var c = gc(), tbody = document.getElementById('oth-tb');
  if(!c.items || c.items.length === 0) { tbody.innerHTML='<tr><td colspan="4" style="text-align:center;color:#666">尚無任何明細</td></tr>'; return; }
  tbody.innerHTML = c.items.map((item, idx) => '<tr><td>'+item.date+'</td><td class="neg">$'+item.amount+'</td><td>'+item.note+'</td><td><button onclick="delOthItem('+idx+')" style="padding:2px 6px;color:var(--red-text);border:none;background:none">刪除</button></td></tr>').join('');
}
async function addOthItem() {
  var c = gc(), d = document.getElementById('od').value, a = parseInt(document.getElementById('oa').value)||0, n = document.getElementById('on').value.trim();
  if(!d || !a) return;
  if(!c.items) c.items = [];
  c.items.unshift({ date: d, amount: a, note: n||'未命名項目' });
  if(window.cloudSaveItem) await window.cloudSaveItem("categories", c.id, c);
  renderCatItems(); document.getElementById('oa').value=''; document.getElementById('on').value='';
}
async function delOthItem(idx) {
  var c = gc(); c.items.splice(idx, 1);
  if(window.cloudSaveItem) await window.cloudSaveItem("categories", c.id, c);
  renderCatItems();
}
</script>
</body>
</html>
