<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="娃娃機">
<meta name="theme-color" content="#0a0a0a">
<title>娃娃機記帳 - 雲端一鍵登入版 v11</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/iconfont/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#242424;--bg4:#2e2e2e;
  --border:#333;--border2:#444;
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
  --green:#00c97f;--green-dim:#0a2e1f;--green-text:#00e896;
  --red:#ff5a47;--red-dim:#2e0f0a;--red-text:#ff7a6a;
  --gold:#f0b429;--gold-dim:#2a1f00;
  --blue:#4d9fff;--blue-dim:#0a1e33;
  --radius:10px;--radius-sm:7px;
  --nav-h:58px;
}
body.light{
  --bg:#f4f3ee;--bg2:#ffffff;--bg3:#ebebе6;--bg4:#deded9;
  --border:#d4d3ce;--border2:#b0afa9;
  --text:#111;--text2:#555;--text3:#999;
  --green:#00915c;--green-dim:#d0f0e2;--green-text:#006e44;
  --red:#d63020;--red-dim:#fde5e2;--red-text:#b01a0c;
  --gold:#b07800;--gold-dim:#fff0cc;
  --blue:#1e65cc;--blue-dim:#ddeeff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans TC',sans-serif;font-size:15px;overflow:hidden}
input,select,button,textarea{font-family:inherit;font-size:14px;-webkit-appearance:none;appearance:none;outline:none}
input,select{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;background:var(--bg3);color:var(--text);width:100%}
input:focus,select:focus{border-color:var(--border2)}
select option{background:var(--bg3)}
button{border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 16px;background:var(--bg3);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:active{opacity:.65}
button.prim{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}

.root{height:100%;display:flex;flex-direction:column}
.nav{height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);flex-shrink:0;z-index:100}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--text3);background:none;border:none;padding:6px 4px;cursor:pointer;border-top:2px solid transparent;margin-top:-1px}
.nb.on{color:var(--green);border-top-color:var(--green)}
.nb i{font-size:20px}

.pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:0 16px 20px;display:none;flex-direction:column}
.page.on{display:flex}
.sub{position:absolute;inset:0;background:var(--bg);overflow-y:auto;padding:0 16px 20px;display:none;flex-direction:column;z-index:50}
.sub.on{display:flex}

.topbar{display:flex;align-items:center;gap:8px;padding:14px 0 11px;position:sticky;top:0;background:var(--bg);z-index:10;flex-shrink:0}
.topbar h2{flex:1;font-size:17px;font-weight:600;letter-spacing:-.3px}
.back{background:var(--blue);border:none;border-radius:var(--radius-sm);color:#fff;font-size:13px;font-weight:600;padding:6px 12px;gap:4px;}
.back i{font-size:15px}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.tap{cursor:pointer}
.tap:active{opacity:.75}

.sg{display:grid;gap:8px;margin-bottom:12px}
.c2{grid-template-columns:1fr 1fr}
.c3{grid-template-columns:1fr 1fr 1fr}
.st{background:var(--bg3);border-radius:var(--radius-sm);padding:10px 12px}
.st .lb{font-size:11px;color:var(--text3);margin-bottom:3px}
.st .vl{font-size:16px;font-weight:600}
.pos{color:var(--green-text)}.neg{color:var(--red-text)}

.tag{display:inline-flex;align-items:center;font-size:11px;padding:2px 7px;border-radius:99px;font-weight:500}
.tc{background:var(--gold-dim);color:var(--gold)}
.ta{background:var(--blue-dim);color:var(--blue)}
.toff{background:var(--bg4);color:var(--text3)}

.fg{margin-bottom:10px}
.fg label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px}
.fg .hint{font-size:11px;color:var(--text3);margin-top:4px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}

.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);color:var(--text3);font-weight:500;white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
td.r{text-align:right}
tr:last-child td{border-bottom:none}

.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab{padding:8px 14px;font-size:13px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;border-top:none;border-left:none;border-right:none;border-radius:0;white-space:nowrap}
.tab.on{color:var(--green);border-bottom-color:var(--green)}

.sbg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:300;display:none;align-items:flex-end}
.sbg.on{display:flex}
.sh{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:20px 16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.shd{display:flex;align-items:center;margin-bottom:16px}
.shd span{flex:1;font-size:16px;font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--text3)}

.mg{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;font-size:12px;margin-top:8px}
.mc .lb{color:var(--text3);font-size:11px;margin-bottom:2px}

.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pc {background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);position:relative;overflow:hidden}
.pi {width:100%;height:110px;object-fit:cover;display:block}
.pph{width:100%;height:110px;display:flex;align-items:center;justify-content:center;background:var(--bg3);color:var(--text3);font-size:32px}
.pinfo{padding:8px 10px 10px}
.pdel{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.85);color:#fff;border:none;font-size:15px;line-height:1;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;}
.pdel:active{background:var(--red)}
.pedit{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.85);color:#fff;border:none;font-size:14px;line-height:1;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;}
.pedit:active{background:var(--blue)}

.chartw{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px;overflow-x:auto;padding-bottom:22px}
.bg2c{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:34px}
.bp{display:flex;align-items:flex-end;gap:2px}
.bar{border-radius:3px 3px 0 0;min-height:2px}
.bi{background:var(--green)}.be{background:var(--red)}
.bl{font-size:10px;color:var(--text3);text-align:center}

.mb{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.mhd{font-size:15px;font-weight:600;margin-bottom:10px}
.orr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px}
.orr:last-child{border-bottom:none}
.osub{padding:3px 0 3px 12px;display:flex;justify-content:space-between;font-size:12px;color:var(--text3)}

.empty{text-align:center;color:var(--text3);padding:2.5rem 0}
.empty i{font-size:38px;display:block;margin-bottom:8px}

.tgrow{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px 0;font-size:14px}
.tgbox{width:22px;height:22px;border:2px solid var(--border2);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--bg3)}
.tgbox.on{background:var(--green);border-color:var(--green)}
.tgbox i{font-size:14px;color:#fff;display:none}
.tgbox.on i{display:block}

.sslbl{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;padding:0 2px}
.ssec{margin-bottom:18px}
.thopts{display:flex;gap:8px;margin-top:6px}
.thopt{flex:1;border:2px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;text-align:center;cursor:pointer;font-size:12px;font-weight:500}
.thopt.on{border-color:var(--green);color:var(--green)}
.thsw{width:28px;height:28px;border-radius:50%;margin:0 auto 6px;border:2px solid var(--border)}
.rphint{font-size:12px;color:var(--text3);margin-top:5px}

.g-user-box{display:flex;align-items:center;gap:12px;margin-top:10px}
.g-avatar{width:36px;height:36px;border-radius:50%;background:var(--bg4)}
.g-info{flex:1;font-size:13px;line-height:1.4}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.sr-label{font-size:14px;font-weight:500}
.sr-sub{font-size:11px;color:var(--text3);margin-top:2px}
</style>
</head>
<body>
<div class="root">
  <div class="pages" id="pages">

    <div id="p-machines" class="page on">
      <div class="topbar"><h2><i class="ti ti-crane"></i> 娃娃機</h2>
        <button id="btn-add-m" onclick="openAddMachine()" disabled><i class="ti ti-plus"></i> 新增</button>
      </div>
      <div id="home-stats" class="sg c3"></div>
      <div id="home-chart" class="chartw" style="display:none">
        <div style="font-size:12px;color:var(--text3);margin-bottom:10px">每月收支</div>
        <div class="bars" id="bar-chart"></div>
        <div style="display:flex;gap:12px;font-size:11px;color:var(--text3);margin-top:4px">
          <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--green);margin-right:4px;vertical-align:middle"></span>收入</span>
          <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--red);margin-right:4px;vertical-align:middle"></span>成本+租金</span>
        </div>
      </div>
      <div id="machine-list"><div class="empty"><i class="ti ti-lock"></i>請先到「設定」登入 Google 帳號</div></div>
      <div id="empty-home" class="empty" style="display:none"><i class="ti ti-crane"></i>還沒有機台<br><span style="font-size:13px">點右上角新增</span></div>
    </div>

    <div id="p-monthly" class="page">
      <div class="topbar"><h2><i class="ti ti-calendar-stats"></i> 月報表</h2>
        <button onclick="exportExcel()"><i class="ti ti-file-spreadsheet"></i> 匯出</button>
      </div>
      <div id="monthly-content"></div>
    </div>

    <div id="p-prizes" class="page">
      <div class="topbar"><h2><i class="ti ti-gift"></i> 獎品庫存</h2>
        <button onclick="showAddPrize()"><i class="ti ti-plus"></i> 新增</button>
      </div>
      <div id="prize-stats" class="sg c2"></div>
      <div id="prize-add-form" class="fcard" style="display:none">
        <div id="pz-form-title" style="font-size:14px;font-weight:600;margin-bottom:12px">新增獎品</div>
        <input type="hidden" id="pz-edit-index" value="-1">
        <div class="fg"><label>獎品名稱</label><input type="text" id="pz-name" placeholder="例：A賞"></div>
        <div class="fg2">
          <div class="fg"><label>成本（元）</label><input type="number" id="pz-cost" placeholder="500"></div>
          <div class="fg"><label>數量</label><input type="number" id="pz-qty" value="1"></div>
        </div>
        <div class="fg"><label>備註</label><input type="text" id="pz-note" placeholder="選填"></div>
        <div class="fg" id="pz-img-container"><label>照片（選填）</label><input type="file" id="pz-img" accept="image/*"></div>
        <div style="display:flex;gap:8px">
          <button id="pz-btn-submit" class="prim" onclick="savePrize()"><i class="ti ti-check"></i> 新增</button>
          <button onclick="cancelPrizeForm()">取消</button>
        </div>
      </div>
      <div class="pg" id="prize-grid"></div>
      <div id="empty-prizes" class="empty" style="display:none"><i class="ti ti-gift"></i>還沒有擺放庫存</div>
    </div>

    <div id="p-other" class="page">
      <div class="topbar"><h2><i class="ti ti-receipt"></i> 其他成本</h2>
        <button onclick="openAddCat()"><i class="ti ti-plus"></i> 類別</button>
      </div>
      <div id="other-monthly-summary"></div>
      <div id="other-list"></div>
      <div id="empty-other" class="empty" style="display:none"><i class="ti ti-receipt"></i>還沒有類別</div>
    </div>

    <div id="p-settings" class="page">
      <div class="topbar"><h2><i class="ti ti-settings"></i> 設定</h2></div>
      
      <div class="ssec">
        <div class="sslbl">Google 帳號聯動 (雲端一鍵版)</div>
        <div class="card">
          <div style="font-size:14px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px">
            <span id="sync-dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5a47"></span>
            <span id="sync-status">未登入</span>
          </div>
          <div id="g-login-area" style="margin-top:12px">
            <button id="btn-g-auth" class="prim" onclick="handleGoogleLogin()" style="width:100%;justify-content:center;background:var(--blue);border-color:var(--blue)"><i class="ti ti-brand-google"></i> 使用 Google 帳號登入</button>
          </div>
          <div id="g-user-area" style="display:none">
            <div class="g-user-box">
              <img id="user-img" class="g-avatar" src="" alt="">
              <div class="g-info">
                <div id="user-name" style="font-weight:600">載入中...</div>
                <div id="user-email" style="font-size:11px;color:var(--text2)">載入中...</div>
              </div>
              <button onclick="handleGoogleLogout()" style="font-size:11px;padding:4px 8px;border-color:var(--red);color:var(--red-text)">登出</button>
            </div>
          </div>
        </div>
      </div>

      <div class="ssec">
        <div class="sslbl">外觀</div>
        <div class="card">
          <div style="font-size:14px;font-500;margin-bottom:8px">背景顏色</div>
          <div class="thopts">
            <div class="thopt on" id="th-dark" onclick="setTheme('dark')"><div class="thsw" style="background:#0f0f0f"></div>深色</div>
            <div class="thopt" id="th-light" onclick="setTheme('light')"><div class="thsw" style="background:#f4f3ee;border-color:#ccc"></div>淺色</div>
          </div>
        </div>
      </div>

      <div class="ssec">
        <div class="sslbl">本地手動備份 / 還原</div>
        <div class="card">
          <div class="setting-row">
            <div><div class="sr-label">匯出 JSON 備份</div><div class="sr-sub">下載本地文字檔備份</div></div>
            <button class="prim" onclick="doExport()"><i class="ti ti-download"></i> 匯出</button>
          </div>
          <div class="setting-row">
            <div><div class="sr-label">匯入 JSON 還原</div><div class="sr-sub">選擇之前備份的 JSON 檔案還原</div></div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
              <input type="file" id="import-file" accept=".json" style="font-size:11px;padding:4px;width:150px">
              <button onclick="doImport()"><i class="ti ti-upload"></i> 還原</button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="sub-machine" class="sub">
    <div class="topbar">
      <button class="back" onclick="closeSub('sub-machine');renderHome()"><i class="ti ti-arrow-left"></i> 返回</button>
      <h2 id="md-title" style="margin-left:8px;flex:1">機台詳情</h2>
      <button onclick="openEditMachine()" style="font-size:13px"><i class="ti ti-edit"></i> 修改</button>
      <button onclick="delMachine()" style="font-size:13px;border-color:transparent;color:var(--red-text)"><i class="ti ti-trash"></i> 刪除</button>
    </div>
    <div id="md-stats" class="sg c2"></div>
    <div class="tabs">
      <button class="tab on" id="t-rec" onclick="setMDTab('rec')">抄表紀錄</button>
      <button class="tab" id="t-rent" onclick="setMDTab('rent')">租金設定</button>
    </div>
    <div id="tab-rec-content">
      <div style="display:flex;gap:8px;margin-bottom:12px">
        <button class="prim" onclick="openAddRec()" style="flex:1;justify-content:center"><i class="ti ti-plus"></i> 新增抄表紀錄</button>
      </div>
      <div class="tw"><table><thead><tr id="th-rec-head"></tr></thead><tbody id="rec-tb"></tbody></table></div>
      <div id="no-rec" class="empty" style="padding:2rem 0;display:none"><i class="ti ti-notes-off" style="font-size:28px"></i>尚無紀錄</div>
    </div>
    <div id="tab-rent-content" style="display:none">
      <div class="fcard">
        <div style="font-size:14px;font-weight:600;margin-bottom:12px">新增租金區間</div>
        <div class="fg2">
          <div class="fg"><label>起始日期</label><input type="date" id="rs"></div>
          <div class="fg"><label>結束日期</label><input type="date" id="re"></div>
        </div>
        <div class="fg2">
          <div class="fg"><label>總金額（元）</label><input type="number" id="ra" placeholder="9000" oninput="rpv()"></div>
          <div class="fg"><label>繳費方式</label>
            <select id="rp"><option value="monthly">月繳</option><option value="quarterly">季繳</option><option value="halfyear">半年繳</option><option value="yearly">年繳</option><option value="custom">自訂</option></select>
          </div>
        </div>
        <div class="fg"><label>備註</label><input type="text" id="rn" placeholder="例：降租"></div>
        <div class="rphint" id="rpv-txt"></div>
        <button class="prim" onclick="mdAddRent()" style="width:100%;justify-content:center;margin-top:8px">新增租金</button>
      </div>
      <div class="tgrow" onclick="toggleInactive()">
        <div class="tgbox" id="tg-inactive"><i class="ti ti-check"></i></div>
        <div>
          <div>標記此機台為已退租（停用）</div>
          <div style="font-size:12px;color:var(--text3);margin-top:2px">停用後排到列表最下方</div>
        </div>
      </div>
      <div class="tw"><table><thead><tr><th>起始</th><th>結束</th><th>總金額</th><th>月均</th><th>方式</th><th>備註</th><th></th></tr></thead><tbody id="rent-tb"></tbody></table></div>
      <div id="no-rent" class="empty" style="padding:2rem 0;display:none"><i class="ti ti-home-off" style="font-size:28px"></i>尚無租金</div>
    </div>
  </div>

  <div id="sub-other" class="sub">
    <div class="topbar">
      <button class="back" onclick="closeSub('sub-other');renderOther()"><i class="ti ti-arrow-left"></i> 返回</button>
      <h2 id="oth-title" style="margin-left:8px;flex:1">類別</h2>
      <button onclick="openEditCat()" style="font-size:13px"><i class="ti ti-edit"></i> 編輯</button>
      <button onclick="delCat()" style="font-size:13px;border-color:transparent;color:var(--red-text)"><i class="ti ti-trash"></i> 刪除</button>
    </div>
    <div class="fcard">
      <div style="font-size:14px;font-weight:600;margin-bottom:12px">記一筆帳目</div>
      <div class="fg2">
        <div class="fg"><label>日期</label><input type="date" id="od"></div>
        <div class="fg"><label>類型</label><select id="ot"><option value="buy">支出</option><option value="sell">收入</option></select></div>
      </div>
      <div class="fg2">
        <div class="fg"><label>金額（元）</label><input type="number" id="oa" placeholder="100"></div>
        <div class="fg"><label>項目說明</label><input type="text" id="on" placeholder="說明文字"></div>
      </div>
      <button class="prim" onclick="addOthItem()" style="width:100%;justify-content:center;margin-top:6px">確認新增</button>
    </div>

import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAykiuo908yAQFa-qSoHhNw2LwmPZiiWFk",
    authDomain: "my-gacha-app-7514f.firebaseapp.com",
    projectId: "my-gacha-app-7514f",
    storageBucket: "my-gacha-app-7514f.firebasestorage.app",
    messagingSenderId: "630194612465",
    appId: "1:630194612465:web:ee860259a9ebbb30286150"
  };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let userUID = null;

onAuthStateChanged(auth, async (user) => {
  if (user) {
    userUID = user.uid;
    document.getElementById('sync-dot').style.background = "#00c97f";
    document.getElementById('sync-status').innerText = "雲端即時同步中";
    document.getElementById('g-login-area').style.display = "none";
    document.getElementById('g-user-area').style.display = "block";
    document.getElementById('user-name').innerText = user.displayName || "Google 用戶";
    document.getElementById('user-email').innerText = user.email;
    document.getElementById('user-img').src = user.photoURL || "";
    document.getElementById('btn-add-m').disabled = false;
    await loadCloudData();
  } else {
    userUID = null;
    window.DB = { machines: [], prizes: [], categories: [] };
    document.getElementById('sync-dot').style.background = "#ff5a47";
    document.getElementById('sync-status').innerText = "請登入 Google 帳號啟用同步";
    document.getElementById('g-login-area').style.display = "block";
    document.getElementById('g-user-area').style.display = "none";
    document.getElementById('btn-add-m').disabled = true;
    document.getElementById('machine-list').innerHTML = '<div class="empty"><i class="ti ti-lock" style="font-size:32px;display:block;margin-bottom:8px"></i>請先到「設定」頁面<br>登入 Google 帳號以讀取雲端資料</div>';
    document.getElementById('home-stats').innerHTML = '';
    document.getElementById('home-chart').style.display = 'none';
  }
});

window.handleGoogleLogin = function() {
  signInWithPopup(auth, provider).catch((e) => alert("登入失敗：" + e.message));
};

window.handleGoogleLogout = function() {
  if(confirm("確定要登出嗎？")) signOut(auth);
};

async function loadCloudData() {
  if (!userUID) return;
  try {
    const docSnap = await getDoc(doc(db, "userData", userUID));
    if (docSnap.exists()) {
      window.DB = docSnap.data();
      if(!window.DB.categories) window.DB.categories=[];
      if(!window.DB.prizes) window.DB.prizes=[];
    } else {
      var local = localStorage.getItem('gachaApp');
      if (local) {
        window.DB = JSON.parse(local);
        await saveToCloud();
      }
    }
  } catch (e) {
    console.error(e);
  }
  window.renderHome();
}

window.save = async function() {
  try {
    localStorage.setItem('gachaApp', JSON.stringify(window.DB));
  } catch(e){}
  await saveToCloud();
};

async function saveToCloud() {
  if (!userUID) return;
  try {
    document.getElementById('sync-status').innerText = "同步中...";
    await setDoc(doc(db, "userData", userUID), window.DB);
    document.getElementById('sync-status').innerText = "雲端即時同步中";
  } catch(e) {
    document.getElementById('sync-status').innerText = "雲端儲存失敗";
  }
}
</script>

<script>
window.DB = { machines: [], prizes: [], categories: [] };
var curMId = null, curCId = null;

function navTo(pageId) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
  document.getElementById(pageId).classList.add('on');
  document.getElementById('b-' + pageId.replace('p-', '')).classList.add('on');
  closeAllSubs();
  if (pageId === 'p-machines') renderHome();
  if (pageId === 'p-monthly') renderMonthly();
  if (pageId === 'p-prizes') renderPrizes();
  if (pageId === 'p-other') renderOther();
}

function closeAllSubs() {
  document.querySelectorAll('.sub').forEach(s => s.classList.remove('on'));
}
function openSub(id) { closeAllSubs(); document.getElementById(id).classList.add('on'); }
function closeSub(id) { document.getElementById(id).classList.remove('on'); }

function openSheet(html) {
  document.getElementById('sheet-content').innerHTML = html;
  document.getElementById('sheet').classList.add('on');
}
function closeSheet() { document.getElementById('sheet').classList.remove('on'); }

function setTheme(t) {
  document.body.className = t;
  document.querySelectorAll('.thopt').forEach(o => o.classList.remove('on'));
  document.getElementById('th-' + t).classList.add('on');
  try { localStorage.setItem('gachaTheme', t); } catch(e){}
}
(function(){
  var t = 'dark';
  try { t = localStorage.getItem('gachaTheme') || 'dark'; } catch(e){}
  setTheme(t);
})();

function gm(){ return window.DB.machines.find(m => m.id === curMId); }
function gc(){ return window.DB.categories.find(c => c.id === curCId); }

function calcS(m) {
  var inc = 0, cost = 0, rent = 0;
  m.records.forEach(r => { inc += r.income; cost += (r.cost || 0); });
  if (m.rents) {
    m.rents.forEach(rentItem => {
      var s = new Date(rentItem.start), e = new Date(rentItem.end);
      var mths = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) + 1;
      if (mths > 0) rent += (rentItem.amount / mths) * mths; 
    });
  }
  return { inc: inc, cost: cost, rent: rent, pnr: inc - cost, p: inc - cost - rent };
}

function renderHome() {
  var sts = document.getElementById('home-stats');
  var list = document.getElementById('machine-list');
  var empty = document.getElementById('empty-home');
  if (!window.DB.machines || window.DB.machines.length === 0) {
    sts.innerHTML = ''; list.innerHTML = '';
    document.getElementById('home-chart').style.display = 'none';
    if(document.getElementById('btn-add-m').disabled) empty.style.display = 'none';
    else empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  var tI = 0, tC = 0, tR = 0;
  window.DB.machines.forEach(m => {
    var s = calcS(m); tI += s.inc; tC += s.cost; tR += s.rent;
  });
  var tp = tI - tC - tR;
  sts.innerHTML = '<div class="st"><div class="lb">總收入</div><div class="vl">$' + tI.toLocaleString() + '</div></div>' +
                  '<div class="st"><div class="lb">總成本</div><div class="vl">$' + tC.toLocaleString() + '</div></div>' +
                  '<div class="st"><div class="lb">扣租後</div><div class="vl ' + (tp >= 0 ? 'pos' : 'neg') + '">$' + tp.toLocaleString() + '</div></div>';

  var active = window.DB.machines.filter(m => !m.inactive);
  var inactive = window.DB.machines.filter(m => m.inactive);
  list.innerHTML = active.concat(inactive).map(m => {
    var s = calcS(m);
    var tTag = m.recordType ? ('<span class="tag ' + (m.recordType === 'coin' ? 'tc' : 'ta') + '">' + (m.recordType === 'coin' ? '幣表' : '幣量') + '</span>') : '';
    var iTag = m.inactive ? '<span class="tag toff">退租</span>' : '';
    return '<div class="card tap" onclick="openMD(' + m.id + ')">' +
           '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap">' +
           '<span style="font-weight:600;font-size:15px">' + m.name + '</span>' + tTag + iTag + '</div>' +
           '<div class="mg">' +
           '<div class="mc"><div class="lb">收入</div><div>$' + s.inc.toLocaleString() + '</div></div>' +
           '<div class="mc"><div class="lb">成本</div><div>$' + s.cost.toLocaleString() + '</div></div>' +
           '<div class="mc"><div class="lb">未扣租</div><div class="' + (s.pnr >= 0 ? 'pos' : 'neg') + '">$' + s.pnr.toLocaleString() + '</div></div>' +
           '<div class="mc"><div class="lb">扣租後</div><div class="' + (s.p >= 0 ? 'pos' : 'neg') + '">$' + s.p.toLocaleString() + '</div></div>' +
           '</div></div>';
  }).join('');
  renderChart();
}

function renderChart() {
  var cw = document.getElementById('home-chart'); var mm = {};
  window.DB.machines.forEach(m => {
    m.records.forEach(r => {
      var ym = r.date.slice(0, 7); if (!mm[ym]) mm[ym] = { inc: 0, exp: 0 };
      mm[ym].inc += r.income; mm[ym].exp += (r.cost || 0);
    });
  });
  var keys = Object.keys(mm).sort();
  if (keys.length === 0) { cw.style.display = 'none'; return; }
  cw.style.display = 'block';
  var max = 0;
  keys.forEach(k => { if (mm[k].inc > max) max = mm[k].inc; if (mm[k].exp > max) max = mm[k].exp; });
  if (max === 0) max = 1;
  document.getElementById('bar-chart').innerHTML = keys.map(k => {
    var h1 = (mm[k].inc / max) * 60; var h2 = (mm[k].exp / max) * 60;
    return '<div class="bg2c"><div class="bp">' +
           '<div class="bar bi" style="height:' + Math.max(h1, 2) + 'px;width:10px"></div>' +
           '<div class="bar be" style="height:' + Math.max(h2, 2) + 'px;width:10px"></div>' +
           '</div><div class="bl">' + k.slice(5) + '月</div></div>';
  }).join('');
}

function openAddMachine() {
  openSheet('<div class="shd"><span>新增機台</span><button class="ghost" onclick="closeSheet()">取消</button></div>' +
            '<div class="fg"><label>機台名稱</label><input type="text" id="m-name" placeholder="例：萬代1號機"></div>' +
            '<div class="fg"><label>記帳模式</label><select id="m-type" onchange="toggleInitMeter(this.value)"><option value="coin">投幣數 (比對前後總幣表差額)</option><option value="amount">實收金額 (每次直接填寫收多少錢)</option></select></div>' +
            '<div class="fg" id="init-meter-box"><label>初始幣表數字（選填）</label><input type="number" id="m-init-meter" placeholder="不填則預設為 0"></div>' +
            '<button class="prim" style="width:100%;justify-content:center;margin-top:10px" onclick="doAddMachine()"><i class="ti ti-check"></i> 確認建立</button>');
}
function toggleInitMeter(val) {
  document.getElementById('init-meter-box').style.display = (val === 'coin') ? 'block' : 'none';
}
function doAddMachine() {
  var n = document.getElementById('m-name').value.trim(); var t = document.getElementById('m-type').value;
  if (!n) return;
  var initM = 0;
  if (t === 'coin') initM = parseInt(document.getElementById('m-init-meter').value) || 0;
  var nm = { id: Date.now(), name: n, recordType: t, initialMeter: initM, records: [], rents: [], inactive: false };
  window.DB.machines.push(nm);
  window.save(); renderHome(); closeSheet();
}

function openMD(id) {
  curMId = id; var m = gm();
  document.getElementById('md-title').innerText = m.name;
  document.getElementById('t-rec').className = 'tab on'; document.getElementById('t-rent').className = 'tab';
  document.getElementById('tab-rec-content').style.display = 'block'; document.getElementById('tab-rent-content').style.display = 'none';
  openSub('sub-machine'); renderMDStats(); renderMDRec();
}
function setMDTab(t) {
  document.getElementById('t-rec').className = 'tab' + (t === 'rec' ? ' on' : '');
  document.getElementById('t-rent').className = 'tab' + (t === 'rent' ? ' on' : '');
  document.getElementById('tab-rec-content').style.display = t === 'rec' ? 'block' : 'none';
  document.getElementById('tab-rent-content').style.display = t === 'rent' ? 'block' : 'none';
  if (t === 'rent') renderMDRent();
}
function renderMDStats() {
  var s = calcS(gm());
  document.getElementById('md-stats').innerHTML =
    '<div class="st"><div class="lb">總營業額</div><div class="vl">$' + s.inc.toLocaleString() + '</div></div>' +
    '<div class="st"><div class="lb">淨利(扣租)</div><div class="vl ' + (s.p >= 0 ? 'pos' : 'neg') + '">$' + s.p.toLocaleString() + '</div></div>';
}

function openEditMachine() {
  var m = gm();
  openSheet('<div class="shd"><span>修改機台</span><button class="ghost" onclick="closeSheet()">取消</button></div>' +
            '<div class="fg"><label>機台名稱</label><input type="text" id="me-name" value="' + m.name + '"></div>' +
            '<button class="prim" style="width:100%;justify-content:center;margin-top:10px" onclick="doEditMachine()">儲存修改</button>');
}
function doEditMachine() {
  var n = document.getElementById('me-name').value.trim(); if (!n) return;
  gm().name = n; document.getElementById('md-title').innerText = n;
  window.save(); closeSheet();
}
function delMachine() {
  if (confirm('確定完全刪除此機台及其所有數據嗎？不可回復！')) {
    window.DB.machines = window.DB.machines.filter(m => m.id !== curMId);
    window.save(); closeSub('sub-machine'); renderHome();
  }
}

function renderMDRec() {
  var m = gm(), tbody = document.getElementById('rec-tb'), h = document.getElementById('th-rec-head');
  if (!m.records || m.records.length === 0) {
    tbody.innerHTML = ''; document.getElementById('no-rec').style.display = 'block'; return;
  }
  document.getElementById('no-rec').style.display = 'none';
  var isCoin = m.recordType === 'coin';
  h.innerHTML = isCoin ? '<th>日期</th><th>總幣表</th><th>淨增</th><th>賣刮</th><th>總收入</th><th>成本</th><th>備註</th><th></th>' 
                       : '<th>日期</th><th>實收</th><th>賣刮</th><th>總收入</th><th>成本</th><th>備註</th><th></th>';
  tbody.innerHTML = m.records.map((r, i) => {
    var scratch = r.scratch || 0;
    var noteStr = r.note || '';
    return isCoin ?
      '<tr><td>' + r.date + '</td><td>' + (r.meter || 0) + '</td><td>' + (r.diff || 0) + '</td><td>$' + scratch + '</td><td><strong>$' + r.income + '</strong></td><td>$' + (r.cost || 0) + '</td><td>' + noteStr + '</td>' +
      '<td><button onclick="delRec(' + i + ')" class="ghost" style="color:var(--red)"><i class="ti ti-trash"></i></button></td></tr>' :
      '<tr><td>' + r.date + '</td><td>$' + (r.amount || 0) + '</td><td>$' + scratch + '</td><td><strong>$' + r.income + '</strong></td><td>$' + (r.cost || 0) + '</td><td>' + noteStr + '</td>' +
      '<td><button onclick="delRec(' + i + ')" class="ghost" style="color:var(--red)"><i class="ti ti-trash"></i></button></td></tr>';
  }).join('');
}

function openAddRec() {
  var m = gm();
  var isCoin = m.recordType === 'coin';
  var lastMeterHint = "";
  if (isCoin) {
    var lastMeter = (m.records && m.records[0]) ? m.records[0].meter : (m.initialMeter || 0);
    lastMeterHint = ' <span style="color:var(--text3); font-size:11px; font-weight:normal;">(前次: ' + lastMeter + ')</span>';
  }

  var formHtml = '<div class="shd"><span>新增抄表紀錄</span><button class="ghost" onclick="closeSheet()">取消</button></div>' +
                 '<div class="fg"><label>抄表日期</label><input type="date" id="rd" value="' + new Date().toISOString().slice(0,10) + '"></div>';
  if (isCoin) {
    formHtml += '<div class="fg"><label>本次總幣表數字' + lastMeterHint + '</label><input type="number" id="rm" placeholder="請輸入主機板當前總幣表"></div>';
  } else {
    formHtml += '<div class="fg"><label>本次實收金額（元）</label><input type="number" id="ri" placeholder="請輸入本次機台內收到的現金"></div>';
  }
  
  formHtml += '<div class="fg"><label>賣刮 / 買洞金額（元，選填）</label><input type="number" id="rs_scratch" placeholder="直接計入本次總收入" value="0"></div>' +
              '<div class="fg"><label>補貨/維修等成本（元，選填）</label><input type="number" id="rc" placeholder="0"></div>' +
              '<div class="fg"><label>備註文字（選填）</label><input type="text" id="rn" placeholder="例：誰買刮、清台、換馬達"></div>' +
              '<button class="prim" style="width:100%;justify-content:center;margin-top:10px" onclick="doAddRec()">確認送出</button>';
  openSheet(formHtml);
}

function doAddRec() {
  var m = gm(), d = document.getElementById('rd').value;
  var c = parseInt(document.getElementById('rc').value) || 0;
  var n = document.getElementById('rn').value.trim();
  var scratch = parseInt(document.getElementById('rs_scratch').value) || 0;
  if (!d) return;

  var rec = { date: d, cost: c, note: n, scratch: scratch, income: 0 };
  
  if (m.recordType === 'coin') {
    var meter = parseInt(document.getElementById('rm').value) || 0;
    var last = (m.records && m.records[0]) ? m.records[0].meter : (m.initialMeter || 0);
    var diff = meter - last; if (diff < 0) diff = 0;
    rec.meter = meter; rec.diff = diff;
    rec.income = (diff * 10) + scratch;
  } else {
    var amt = parseInt(document.getElementById('ri').value) || 0;
    rec.amount = amt;
    rec.income = amt + scratch;
  }
  
  m.records.unshift(rec);
  m.records.sort((a,b) => b.date.localeCompare(a.date));
  
  if (m.recordType === 'coin') {
    var currentBase = m.initialMeter || 0;
    for(var i = m.records.length - 1; i >= 0; i--) {
      var dff = m.records[i].meter - currentBase;
      if (dff < 0) dff = 0;
      m.records[i].diff = dff;
      m.records[i].income = (dff * 10) + (m.records[i].scratch || 0);
      currentBase = m.records[i].meter;
    }
  }

  window.save(); renderMDStats(); renderMDRec(); closeSheet();
}

function delRec(i) {
  if (confirm('確定刪除此紀錄？')) {
    var m = gm();
    m.records.splice(i, 1);
    if (m.recordType === 'coin') {
      var currentBase = m.initialMeter || 0;
      for(var j = m.records.length - 1; j >= 0; j--) {
        var dff = m.records[j].meter - currentBase;
        if (dff < 0) dff = 0;
        m.records[j].diff = dff;
        m.records[j].income = (dff * 10) + (m.records[j].scratch || 0);
        currentBase = m.records[j].meter;
      }
    }
    window.save(); renderMDStats(); renderMDRec();
  }
}

function renderMDRent() {
  var m = gm(); document.getElementById('tg-inactive').classList.toggle('on', !!m.inactive);
  var tbody = document.getElementById('rent-tb');
  if (!m.rents || m.rents.length === 0) {
    tbody.innerHTML = ''; document.getElementById('no-rent').style.display = 'block'; return;
  }
  document.getElementById('no-rent').style.display = 'none';
  tbody.innerHTML = m.rents.map((r, i) => {
    var s = new Date(r.start), e = new Date(r.end);
    var mths = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) + 1;
    var avg = mths > 0 ? Math.round(r.amount / mths) : r.amount;
    var pTxt = r.period === 'monthly' ? '月繳' : r.period === 'quarterly' ? '季繳' : r.period === 'halfyear' ? '半年繳' : r.period === 'yearly' ? '年繳' : '自訂';
    return '<tr><td>' + r.start.slice(5) + '</td><td>' + r.end.slice(5) + '</td><td>$' + r.amount + '</td><td>$' + avg + '</td><td>' + pTxt + '</td><td>' + (r.note || '') + '</td>' +
           '<td><button onclick="delRent(' + i + ')" class="ghost" style="color:var(--red)"><i class="ti ti-trash"></i></button></td></tr>';
  }).join('');
}
function rpv() {
  var s = document.getElementById('rs').value, e = document.getElementById('re').value, a = parseInt(document.getElementById('ra').value) || 0;
  if(!s || !e || !a) { document.getElementById('rpv-txt').innerText = ''; return; }
  var d1 = new Date(s), d2 = new Date(e);
  var m = (d2.getFullYear() - d1.getFullYear()) * 12 + (d2.getMonth() - d1.getMonth()) + 1;
  document.getElementById('rpv-txt').innerText = m > 0 ? '共涵蓋 ' + m + ' 個月，平均每個月租金：$' + Math.round(a / m) : '日期不正確';
}
function mdAddRent() {
  var m = gm(), start = document.getElementById('rs').value, end = document.getElementById('re').value;
  var amt = parseInt(document.getElementById('ra').value) || 0, p = document.getElementById('rp').value, note = document.getElementById('rn').value.trim();
  if (!start || !end || !amt) return;
  if (!m.rents) m.rents = [];
  m.rents.push({ start: start, end: end, amount: amt, period: p, note: note });
  m.rents.sort((a,b) => b.start.localeCompare(a.start));
  window.save(); renderMDRent();
}
function delRent(i) {
  if (confirm('確定刪除此合約？')) { gm().rents.splice(i, 1); window.save(); renderMDRent(); }
}
function toggleInactive() {
  var m = gm(); m.inactive = !m.inactive;
  document.getElementById('tg-inactive').classList.toggle('on', !!m.inactive);
  window.save();
}

function renderMonthly() {
  var c = document.getElementById('monthly-content'); var data = {};
  window.DB.machines.forEach(m => {
    m.records.forEach(r => {
      var ym = r.date.slice(0, 7); if (!data[ym]) data[ym] = { inc: 0, cost: 0, rent: 0, details: {} };
      data[ym].inc += r.income; data[ym].cost += (r.cost || 0);
      if (!data[ym].details[m.name]) data[ym].details[m.name] = { inc: 0, cost: 0, rent: 0 };
      data[ym].details[m.name].inc += r.income; data[ym].details[m.name].cost += (r.cost || 0);
    });
    if (m.rents) {
      m.rents.forEach(rent => {
        var s = new Date(rent.start), e = new Date(rent.end);
        var mths = (e.getFullYear() - s.getFullYear()) * 12 + (e.getMonth() - s.getMonth()) + 1;
        if (mths <= 0) return; var avg = rent.amount / mths;
        for (var i = 0; i < mths; i++) {
          var d = new Date(s.getFullYear(), s.getMonth() + i, 1);
          var ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
          if (!data[ym]) data[ym] = { inc: 0, cost: 0, rent: 0, details: {} };
          data[ym].rent += avg;
          if (!data[ym].details[m.name]) data[ym].details[m.name] = { inc: 0, cost: 0, rent: 0 };
          data[ym].details[m.name].rent += avg;
        }
      });
    }
  });
  var keys = Object.keys(data).sort().reverse();
  if (keys.length === 0) { c.innerHTML = '<div class="empty"><i class="ti ti-calendar-stats"></i>尚無月份報表數據</div>'; return; }
  c.innerHTML = keys.map(k => {
    var o = data[k], net = o.inc - o.cost - o.rent;
    var dHtml = Object.keys(o.details).map(mn => {
      var det = o.details[mn], p = det.inc - det.cost - det.rent;
      return '<div class="orr"><span>' + mn + '</span><span class="' + (p >= 0 ? 'pos' : 'neg') + '">$' + Math.round(p).toLocaleString() + '</span></div>' +
             '<div class="osub"><span>收 $' + det.inc + ' | 成本 $' + det.cost + ' | 租 $' + Math.round(det.rent) + '</span></div>';
    }).join('');
    return '<div class="mb"><div class="mhd" style="display:flex;justify-content:between"><span>' + k + ' 總覽</span>' +
           '<span class="' + (net >= 0 ? 'pos' : 'neg') + '" style="margin-left:auto">$' + Math.round(net).toLocaleString() + '</span></div>' +
           '<div style="font-size:12px;color:var(--text2);margin-bottom:8px">總收: $' + o.inc + ' | 總成本: $' + o.cost + ' | 總分攤租金: $' + Math.round(o.rent) + '</div>' +
           '<div style="border-top:1px dashed var(--border);padding-top:6px">' + dHtml + '</div></div>';
  }).join('');
}

function renderPrizes() {
  var grid = document.getElementById('prize-grid'); var empty = document.getElementById('empty-prizes'); var stats = document.getElementById('prize-stats');
  if (!window.DB.prizes || window.DB.prizes.length === 0) {
    grid.innerHTML = ''; stats.innerHTML = ''; empty.style.display = 'block'; return;
  }
  empty.style.display = 'none';
  var tc = 0, tq = 0; window.DB.prizes.forEach(p => { tc += (p.cost * p.qty); tq += p.qty; });
  stats.innerHTML = '<div class="st"><div class="lb">庫存總數量</div><div class="vl">' + tq + ' 個</div></div>' +
                    '<div class="st"><div class="lb">庫存總成本</div><div class="vl">$' + tc.toLocaleString() + '</div></div>';
  grid.innerHTML = window.DB.prizes.map((p, i) => {
    var imgHtml = p.img ? '<img src="' + p.img + '" class="pi">' : '<div class="pph"><i class="ti ti-gift"></i></div>';
    return '<div class="pc">' + imgHtml + 
           '<button class="pedit" onclick="openEditPrize(' + i + ')"><i class="ti ti-edit"></i></button>' +
           '<button class="pdel" onclick="delPrize(' + i + ')"><i class="ti ti-trash"></i></button>' +
           '<div class="pinfo"><div style="font-weight:600;font-size:14px;margin-bottom:2px">' + p.name + '</div>' +
           '<div style="font-size:11px;color:var(--text3)">成本：$' + p.cost + ' | 剩餘：' + p.qty + '</div>' +
           (p.note ? '<div style="font-size:11px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + p.note + '</div>' : '') +
           '</div></div>';
  }).join('');
}

function showAddPrize() {
  document.getElementById('pz-form-title').innerText = "新增獎品";
  document.getElementById('pz-edit-index').value = "-1";
  document.getElementById('pz-name').value = '';
  document.getElementById('pz-cost').value = '';
  document.getElementById('pz-qty').value = '1';
  document.getElementById('pz-note').value = '';
  document.getElementById('pz-img').value = '';
  document.getElementById('pz-img-container').style.display = 'block';
  document.getElementById('pz-btn-submit').innerHTML = '<i class="ti ti-check"></i> 新增';
  document.getElementById('prize-add-form').style.display = 'block';
}

function openEditPrize(idx) {
  var p = window.DB.prizes[idx];
  document.getElementById('pz-form-title').innerText = "編輯獎品資料";
  document.getElementById('pz-edit-index').value = idx;
  document.getElementById('pz-name').value = p.name;
  document.getElementById('pz-cost').value = p.cost;
  document.getElementById('pz-qty').value = p.qty;
  document.getElementById('pz-note').value = p.note || '';
  document.getElementById('pz-img-container').style.display = 'none'; 
  document.getElementById('pz-btn-submit').innerHTML = '<i class="ti ti-device-floppy"></i> 儲存修改';
  document.getElementById('prize-add-form').style.display = 'block';
  document.getElementById('p-prizes').scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelPrizeForm() {
  document.getElementById('prize-add-form').style.display = 'none';
}

// 🛠️ 核心修復：使用 async 確保資料庫有確實同步完才渲染、關視窗
async function savePrize() {
  var name = document.getElementById('pz-name').value.trim();
  var cost = parseInt(document.getElementById('pz-cost').value) || 0;
  var qty = parseInt(document.getElementById('pz-qty').value) || 0;
  var note = document.getElementById('pz-note').value.trim();
  var editIdx = parseInt(document.getElementById('pz-edit-index').value);
  
  if (!name || qty < 0) return;

  document.getElementById('pz-btn-submit').disabled = true;
  document.getElementById('pz-btn-submit').innerText = "儲存同步中...";

  if (editIdx > -1) {
    window.DB.prizes[editIdx].name = name;
    window.DB.prizes[editIdx].cost = cost;
    window.DB.prizes[editIdx].qty = qty;
    window.DB.prizes[editIdx].note = note;
    await window.save(); 
    renderPrizes();
    document.getElementById('prize-add-form').style.display = 'none';
    document.getElementById('pz-btn-submit').disabled = false;
  } else {
    var file = document.getElementById('pz-img').files[0];
    if (file) {
      var r = new FileReader(); 
      r.onload = async function(e) { 
        await doSavePrize(name, cost, qty, note, e.target.result); 
        document.getElementById('pz-btn-submit').disabled = false;
      }; 
      r.readAsDataURL(file);
    } else {
      await doSavePrize(name, cost, qty, note, '');
      document.getElementById('pz-btn-submit').disabled = false;
    }
  }
}

async function doSavePrize(n, c, q, nt, img) {
  if(!window.DB.prizes) window.DB.prizes = [];
  window.DB.prizes.push({ name: n, cost: c, qty: q, note: nt, img: img });
  await window.save(); 
  renderPrizes();
  document.getElementById('prize-add-form').style.display = 'none';
}

async function delPrize(i) {
  if (confirm('確定完全刪除此庫存？')) { 
    window.DB.prizes.splice(i, 1); 
    await window.save(); 
    renderPrizes(); 
  }
}

function renderOther() {
  var list = document.getElementById('other-list'), empty = document.getElementById('empty-other'), sum = document.getElementById('other-monthly-summary');
  if (!window.DB.categories || window.DB.categories.length === 0) {
    list.innerHTML = ''; sum.innerHTML = ''; empty.style.display = 'block'; return;
  }
  empty.style.display = 'none';
  var ti = 0, te = 0;
  window.DB.categories.forEach(c => {
    if (c.items) c.items.forEach(it => { if (it.type === 'buy') te += it.amount; else ti += it.amount; });
  });
  sum.innerHTML = '<div class="st"><div class="lb">其他總收入</div><div class="vl" style="color:var(--green-text)">+$' + ti + '</div></div>' +
                  '<div class="st"><div class="lb">其他總支出</div><div class="vl" style="color:var(--red-text)">-$' + te + '</div></div>' +
                  '<div class="st"><div class="lb">雜項差額</div><div class="vl">$' + (ti - te) + '</div></div>';
  
  var sortedCats = [...window.DB.categories].reverse();
  
  list.innerHTML = sortedCats.map(c => {
    var iAmt = 0, eAmt = 0; if (c.items) c.items.forEach(it => { if (it.type === 'buy') eAmt += it.amount; else iAmt += it.amount; });
    return '<div class="card tap" onclick="openOth(' + c.id + ')">' +
           '<div style="font-weight:600;font-size:15px;margin-bottom:4px">' + c.name + '</div>' +
           '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;margin-top:8px">' +
           '<div><span style="color:var(--text3)">總項數:</span> ' + (c.items ? c.items.length : 0) + '</div>' +
           '<div style="color:var(--red-text)">支: $' + eAmt + '</div>' +
           '<div style="color:var(--green-text)">收: $' + iAmt + '</div>' +
           '</div></div>';
  }).join('');
}
function openAddCat() {
  openSheet('<div class="shd"><span>新增成本類別</span><button class="ghost" onclick="closeSheet()">取消</button></div>' +
            '<div class="fg"><label>類別名稱</label><input type="text" id="c-name" placeholder="例：餐飲雜支、油錢"></div>' +
            '<button class="prim" style="width:100%;justify-content:center;margin-top:10px" onclick="doAddCat()">確認建立</button>');
}
function doAddCat() {
  var n = document.getElementById('c-name').value.trim(); if (!n) return;
  if (!window.DB.categories) window.DB.categories = [];
  window.DB.categories.push({ id: Date.now(), name: n, items: [] });
  window.save(); renderOther(); closeSheet();
}
function openOth(id) {
  curCId = id; var c = gc(); document.getElementById('oth-title').innerText = c.name;
  document.getElementById('od').value = new Date().toISOString().slice(0, 10);
  document.getElementById('oa').value = ''; document.getElementById('on').value = '';
  openSub('sub-other'); renderCatItems();
}
function openEditCat() {
  openSheet('<div class="shd"><span>更名類別</span><button class="ghost" onclick="closeSheet()">取消</button></div>' +
            '<div class="fg"><label>名稱</label><input type="text" id="ce-name" value="' + gc().name + '"></div>' +
            '<button class="prim" style="width:100%;justify-content:center;margin-top:10px" onclick="doEditCat()">變更</button>');
}
function doEditCat() {
  var n = document.getElementById('ce-name').value.trim(); if (!n) return;
  gc().name = n; document.getElementById('oth-title').innerText = n;
  window.save(); closeSheet();
}
function delCat() {
  if (confirm('確定刪除此類別及其下的所有項目？')) {
    window.DB.categories = window.DB.categories.filter(c => c.id !== curCId);
    window.save(); closeSub('sub-other'); renderOther();
  }
}
function addOthItem() {
  var c = gc(), d = document.getElementById('od').value, t = document.getElementById('ot').value;
  var a = parseInt(document.getElementById('oa').value) || 0, n = document.getElementById('on').value.trim();
  if (!d || !a) return;
  if (!c.items) c.items = [];
  c.items.push({ date: d, type: t, amount: a, note: n });
  c.items.sort((a,b) => b.date.localeCompare(a.date));
  window.save(); renderCatItems();
  document.getElementById('oa').value = ''; document.getElementById('on').value = '';
}
function renderCatItems() {
  var c = gc(); var tbody = document.getElementById('oth-tb'); if (!c.items) c.items = [];
  tbody.innerHTML = c.items.map((item, i) => {
    return '<tr><td>' + item.date + '</td><td>' + (item.type === 'buy' ? '支出' : '收入') + '</td><td>$' + item.amount + '</td><td>' + item.note + '</td>' +
           '<td><button onclick="delOthItem(' + i + ')" class="ghost" style="color:var(--red)"><i class="ti ti-trash"></i></button></td></tr>';
  }).join('');
}
function delOthItem(i) { gc().items.splice(i, 1); window.save(); renderCatItems(); }

function doExport() {
  var blob = new Blob([JSON.stringify(window.DB)], { type: 'application/json' });
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = '娃娃機備份_' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click();
  setTimeout(function() { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 200);
}
function doImport() {
  var file = document.getElementById('import-file').files[0];
  if (!file) { alert('請先選擇要還原的 JSON 備份檔案'); return; }
  if (!confirm('確定要執行備份還原？目前設備上所有未同步的資料將被覆蓋。')) return;
  var reader = new FileReader();
  reader.onload = function(evt) {
    try {
      var parsed = JSON.parse(evt.target.result);
      if (!parsed || !Array.isArray(parsed.machines)) throw new Error('檔案格式不相符或結構損毀');
      window.DB = parsed;
      if (!window.DB.categories) window.DB.categories = [];
      if (!window.DB.prizes) window.DB.prizes = [];
      window.save();
      alert('還原完成！共成功載入 ' + window.DB.machines.length + ' 台機台資料。');
      navTo('p-machines');
    } catch (err) { alert('還原失敗：' + err.message); }
  };
  reader.readAsText(file, 'UTF-8');
}

function exportExcel() {
  if (!window.DB.machines || window.DB.machines.length === 0) { alert('無機台資料可供匯出'); return; }
  var rows = [];
  rows.push(["機台名稱", "紀錄日期", "類型", "數據欄位", "賣刮金額", "總收入(元)", "成本(元)", "備註"]);
  window.DB.machines.forEach(m => {
    m.records.forEach(r => {
      var scratch = r.scratch || 0;
      rows.push([m.name, r.date, m.recordType === 'coin' ? '幣表抄表' : '實收抄表', m.recordType === 'coin' ? '總表值: ' + r.meter : '實收: ' + (r.amount || 0), scratch, r.income, r.cost || 0, r.note || '']);
    });
    if (m.rents) {
      m.rents.forEach(rt => { rows.push([m.name, rt.start + '~' + rt.end, '固定租金合約', '合約總租金', 0, 0, rt.amount, '繳費方式: ' + rt.period + ' / ' + (rt.note || '')]); });
    }
  });
  if (window.DB.categories) {
    window.DB.categories.forEach(c => {
      if (c.items) c.items.forEach(it => { rows.push(["【其他成本】" + c.name, it.date, it.type === 'buy' ? '雜項支出' : '雜項收入', '獨立單筆', 0, it.type === 'sell' ? it.amount : 0, it.type === 'buy' ? it.amount : 0, it.note || '']); });
    });
  }
  var wb = XLSX.utils.book_new(); var ws = XLSX.utils.aoa_to_sheet(rows);
  XLSX.utils.book_append_sheet(wb, ws, "娃娃機帳目細目");
  XLSX.writeFile(wb, '娃娃機記帳總報表_' + new Date().toISOString().slice(0, 10) + '.xlsx');
}
</script>
